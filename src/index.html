<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip Explorer 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0b1026; --bg1:#16204a; --panel:rgba(14,20,48,.82); --line:rgba(255,255,255,.12);
    --ink:#eef2ff; --mut:#a9b3d6; --acc:#ffcf3f; --acc2:#5ad1ff; --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 70% 20%, #24306a 0%, var(--bg1) 35%, var(--bg0) 100%);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35)}
  header{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:8px 12px;z-index:5}
  header h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;margin:0;letter-spacing:.3px;white-space:nowrap}
  header h1 span{color:var(--acc)}
  header .sub{color:var(--mut);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button,.btn{font:inherit;font-weight:800;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;transition:background .15s,transform .08s;white-space:nowrap}
  button:hover,.btn:hover{background:rgba(255,255,255,.16)}
  button:active{transform:scale(.97)}
  button.primary{background:var(--acc);color:#2a1d00;border-color:transparent}
  button.primary:hover{background:#ffe07a}
  button.on{background:var(--acc2);color:#002233;border-color:transparent}
  .langs{display:flex;gap:4px}
  .langs button{padding:6px 9px;font-size:13px}
  #legend{position:fixed;top:78px;left:12px;width:280px;max-height:calc(100% - 200px);display:flex;flex-direction:column;z-index:4}
  #legend .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
  #legend .hd b{font-family:'Baloo 2';font-size:18px}
  #legend .hd .mini button{padding:3px 8px;font-size:12px}
  #layers{overflow:auto;padding:0 6px 8px}
  .lay{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;cursor:pointer;user-select:none}
  .lay:hover{background:rgba(255,255,255,.07)}
  .lay input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;flex:none}
  .sw{width:22px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .lay .nm{flex:1;min-width:0;line-height:1.15}
  .lay .nm div{font-weight:800;font-size:14px}
  .lay .nm small{color:var(--mut);font-size:11px}
  .lay.dim{opacity:.45}
  #hiddenNote{color:var(--mut);font-size:11px;padding:4px 12px 10px}
  #dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:10px 14px;z-index:5;max-width:calc(100% - 24px)}
  .ctl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
  .ctl input[type=range]{width:110px;accent-color:var(--acc)}
  .ctl .val{color:var(--mut);font-size:12px;min-width:34px}
  select{font:inherit;font-weight:700;color:var(--ink);background:#1b2552;border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:220px}
  .sep{width:1px;height:28px;background:var(--line)}
  #card{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:min(640px,calc(100% - 24px));padding:16px 18px 14px;z-index:6;display:none}
  #card.show{display:block;animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  #card .step{color:var(--acc);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px}
  #card h2{font-family:'Baloo 2';font-size:28px;line-height:1.1;margin:2px 0 6px;display:flex;align-items:center;gap:10px}
  #card h2 .sw{width:28px;height:20px}
  #card p{margin:0;font-size:18px;line-height:1.45}
  #card .nav{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  #card .x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:22px;color:var(--mut);padding:4px 8px}
  #stats{position:fixed;right:12px;top:78px;padding:10px 14px;z-index:4;max-width:300px;font-size:13px;line-height:1.4}
  #stats b{font-family:'Baloo 2';font-size:16px}
  #stats .fact{color:var(--acc);font-weight:800;margin-top:4px}
  #tip{position:fixed;pointer-events:none;padding:5px 9px;font-size:13px;font-weight:800;border-radius:8px;background:rgba(0,0,0,.75);z-index:7;display:none}
  #busy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,25,.6);z-index:20;font-family:'Baloo 2';font-size:28px}
  #busy.show{display:flex}
  #drop{position:fixed;inset:12px;border:4px dashed var(--acc);border-radius:24px;display:none;align-items:center;justify-content:center;background:rgba(10,15,40,.7);z-index:19;font-family:'Baloo 2';font-size:34px}
  #drop.show{display:flex}
  #warn{position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:6;display:none;color:#ffd5a0;font-weight:800;font-size:14px;max-width:min(560px,calc(100% - 640px))}
  #legendToggle{display:none}
  @media (max-width:900px){
    header .sub{display:none}
    #legend{width:240px;display:none}
    #legend.open{display:flex}
    #legendToggle{display:inline-block}
    #stats{display:none}
    #warn{max-width:calc(100% - 24px)}
  }
  input[type=file]{display:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>

<header class="panel">
  <h1>Chip<span>Explorer</span> 3D</h1>
  <div class="sub" id="subtitle"></div>
  <button id="legendToggle">☰</button>
  <button class="primary" id="btnBuild"></button>
  <label class="btn" id="btnOpen"><span id="tOpen"></span><input type="file" id="file" accept=".gds,.gds2,.gdsii,.gz,.GDS"></label>
  <button id="btnDemo"></button>
  <div class="langs"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="it">IT</button></div>
</header>

<div id="legend" class="panel">
  <div class="hd"><b id="tLayers"></b><span class="mini"><button id="allOn"></button> <button id="allOff"></button></span></div>
  <div id="layers"></div>
  <div id="hiddenNote"></div>
</div>

<div id="stats" class="panel"></div>
<div id="warn" class="panel"></div>

<div id="card" class="panel">
  <button class="x" id="cardX">×</button>
  <div class="step" id="cStep"></div>
  <h2 id="cTitle"></h2>
  <p id="cText"></p>
  <div class="nav" id="cNav">
    <button id="bPrev">‹</button><button id="bPause"></button><button id="bNext">›</button><button class="primary" id="bFinish"></button>
  </div>
</div>

<div id="dock" class="panel">
  <div class="ctl"><span id="tExplode"></span><input type="range" id="explode" min="0" max="100" value="0"></div>
  <div class="ctl"><span id="tHeight"></span><input type="range" id="zscale" min="0" max="100" value="0"><span class="val" id="zval"></span></div>
  <div class="ctl"><span id="tSlice"></span><input type="range" id="slice" min="0" max="100" value="100"></div>
  <div class="sep"></div>
  <button id="bRotate"></button>
  <button id="v3d">3D</button><button id="vTop"></button><button id="vSide"></button>
  <div class="sep"></div>
  <div class="ctl"><span id="tCompare"></span><select id="compare"></select></div>
  <div class="ctl"><span id="tTech"></span><select id="tech"></select></div>
  <div class="ctl"><span id="tCell"></span><select id="cell"></select></div>
</div>

<div id="tip"></div>
<div id="busy"><span id="busyMsg">…</span></div>
<div id="drop"><span id="tDrop"></span></div>

/* =========================== GDSII parser =========================== */
function real8(dv,p){ const b0=dv.getUint8(p); const sgn=b0&0x80?-1:1; const ex=(b0&0x7f)-64; let m=0; for(let k=1;k<8;k++) m=m*256+dv.getUint8(p+k); return sgn*(m/72057594037927936)*Math.pow(16,ex); }
function gstr(dv,p,n){ let s=''; for(let k=0;k<n;k++){ const c=dv.getUint8(p+k); if(!c) break; s+=String.fromCharCode(c);} return s; }
function pathPolys(xy,w,pt,bx,ex){
  const hw=Math.abs(w)/2, n=xy.length/2, out=[]; if(!hw||n<2) return out;
  const ext=t=>pt===0?0:pt===4?t:hw;
  for(let k=0;k<n-1;k++){
    let x0=xy[2*k],y0=xy[2*k+1],x1=xy[2*k+2],y1=xy[2*k+3]; const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); if(!L) continue;
    const ux=dx/L,uy=dy/L, e0=k===0?ext(bx):hw, e1=k===n-2?ext(ex):hw;
    x0-=ux*e0;y0-=uy*e0;x1+=ux*e1;y1+=uy*e1; const nx=-uy*hw,ny=ux*hw;
    out.push(new Float64Array([x0+nx,y0+ny,x1+nx,y1+ny,x1-nx,y1-ny,x0-nx,y0-ny]));
  }
  return out;
}
function parseGDS(buf){
  const dv=new DataView(buf), N=dv.byteLength; let i=0, cur=null, el=null, sawHeader=false;
  const lib={structs:new Map(),dbu:0.001};
  const addPoly=(key,pts)=>{ let a=cur.polys.get(key); if(!a){a=[];cur.polys.set(key,a);} a.push(pts); };
  while(i+4<=N){
    const len=dv.getUint16(i), rt=dv.getUint8(i+2), p=i+4, n=len-4;
    if(len<4) break;
    switch(rt){
      case 0x00: sawHeader=true; break;
      case 0x03: lib.dbu=real8(dv,p+8)*1e6; break;
      case 0x05: cur={name:'',polys:new Map(),refs:[]}; break;
      case 0x06: if(cur){cur.name=gstr(dv,p,n); lib.structs.set(cur.name,cur);} break;
      case 0x07: cur=null; break;
      case 0x08: case 0x2D: el={t:'b'}; break;
      case 0x09: el={t:'p',w:0,pt:0,bx:0,ex:0}; break;
      case 0x0A: el={t:'s'}; break;
      case 0x0B: el={t:'a'}; break;
      case 0x0C: case 0x15: el={t:'x'}; break;
      case 0x0D: if(el) el.layer=dv.getInt16(p); break;
      case 0x0E: case 0x2E: if(el) el.dt=dv.getInt16(p); break;
      case 0x0F: if(el) el.w=dv.getInt32(p); break;
      case 0x21: if(el) el.pt=dv.getInt16(p); break;
      case 0x30: if(el) el.bx=dv.getInt32(p); break;
      case 0x31: if(el) el.ex=dv.getInt32(p); break;
      case 0x10: if(el){ const k=n>>2, a=new Float64Array(k); for(let j=0;j<k;j++) a[j]=dv.getInt32(p+4*j); el.xy=a; } break;
      case 0x12: if(el) el.sname=gstr(dv,p,n); break;
      case 0x13: if(el){ el.cols=dv.getInt16(p); el.rows=dv.getInt16(p+2);} break;
      case 0x1A: if(el) el.refl=(dv.getUint16(p)&0x8000)!==0; break;
      case 0x1B: if(el) el.mag=real8(dv,p); break;
      case 0x1C: if(el) el.angle=real8(dv,p); break;
      case 0x11:
        if(cur&&el&&el.xy){
          const key=el.layer+'/'+(el.dt||0);
          if(el.t==='b'){ let a=el.xy; let m=a.length/2; if(m>1&&a[0]===a[2*m-2]&&a[1]===a[2*m-1]) m--; if(m>=3) addPoly(key,a.subarray(0,2*m)); }
          else if(el.t==='p'){ for(const q of pathPolys(el.xy,el.w,el.pt,el.bx,el.ex)) addPoly(key,q); }
          else if(el.t==='s'||el.t==='a'){
            const m=el.mag||1, th=(el.angle||0)*Math.PI/180, s=el.refl?-1:1, c=Math.cos(th), sn=Math.sin(th);
            const r={sname:el.sname,a:m*c,b:m*sn,c:-m*sn*s,d:m*c*s,x:el.xy[0],y:el.xy[1]};
            if(el.t==='a'&&el.cols&&el.rows&&el.xy.length>=6){ r.cols=el.cols; r.rows=el.rows;
              r.cx=(el.xy[2]-el.xy[0])/el.cols; r.cy=(el.xy[3]-el.xy[1])/el.cols; r.rx=(el.xy[4]-el.xy[0])/el.rows; r.ry=(el.xy[5]-el.xy[1])/el.rows; }
            cur.refs.push(r);
          }
        }
        el=null; break;
    }
    i+=len;
  }
  if(!sawHeader||!lib.structs.size) throw new Error('not gds');
  return lib;
}
function libKeys(lib){ const m=new Map(); for(const s of lib.structs.values()) for(const [k,a] of s.polys) m.set(k,(m.get(k)||0)+a.length); return m; }
function topCells(lib){ const used=new Set(); for(const s of lib.structs.values()) for(const r of s.refs) used.add(r.sname); return [...lib.structs.keys()].filter(n=>!used.has(n)); }
function makeCounter(lib,keys){ const memo=new Map(), stack=new Set();
  const f=name=>{ if(memo.has(name)) return memo.get(name); const s=lib.structs.get(name); if(!s||stack.has(name)) return 0; stack.add(name);
    let c=0; for(const [k,a] of s.polys) if(!keys||keys.has(k)) c+=a.length;
    for(const r of s.refs) c+=f(r.sname)*((r.cols||1)*(r.rows||1));
    stack.delete(name); memo.set(name,c); return c; };
  return f; }
function flatten(lib,top,keys,cap){
  const out=new Map(); let count=0, truncated=false;
  const bb=[Infinity,Infinity,-Infinity,-Infinity];
  const visit=(name,M,depth)=>{
    if(truncated||depth>64) return; const s=lib.structs.get(name); if(!s) return;
    const [a,b,c,d,tx,ty]=M;
    for(const [k,arr] of s.polys){ if(!keys.has(k)) continue; let o=out.get(k); if(!o){o=[];out.set(k,o);}
      for(const p of arr){ if(count>=cap){truncated=true;return;}
        const q=new Float64Array(p.length);
        for(let j=0;j<p.length;j+=2){ const x=p[j],y=p[j+1], X=a*x+c*y+tx, Y=b*x+d*y+ty; q[j]=X;q[j+1]=Y;
          if(X<bb[0])bb[0]=X; if(Y<bb[1])bb[1]=Y; if(X>bb[2])bb[2]=X; if(Y>bb[3])bb[3]=Y; }
        o.push(q); count++; } }
    for(const r of s.refs){ const C=r.cols||1,R=r.rows||1;
      for(let ci=0;ci<C;ci++) for(let ri=0;ri<R;ri++){
        const ox=r.x+(r.cols?ci*r.cx+ri*r.rx:0), oy=r.y+(r.cols?ci*r.cy+ri*r.ry:0);
        visit(r.sname,[a*r.a+c*r.b, b*r.a+d*r.b, a*r.c+c*r.d, b*r.c+d*r.d, a*ox+c*oy+tx, b*ox+d*oy+ty],depth+1);
        if(truncated) return; } }
  };
  visit(top,[1,0,0,1,0,0],0);
  return {layers:out,count,truncated,bb};
}

function buildGeometry(polys,z0,z1,cx,cy,withEdges){
  let nv=0,ni=0; for(const p of polys){const n=p.length/2; nv+=2*n; ni+=(n-2)*6+n*6;}
  const pos=new Float32Array(nv*3), idx=nv>65535?new Uint32Array(ni):new Uint16Array(ni);
  const ep=withEdges?new Float32Array(polys.reduce((s,p)=>s+p.length/2*18,0)):null; let e=0;
  let v=0,k=0;
  for(const p of polys){
    const n=p.length/2, base=v;
    for(let j=0;j<n;j++){ const x=p[2*j]-cx, y=p[2*j+1]-cy; pos[3*v]=x;pos[3*v+1]=z1;pos[3*v+2]=-y; pos[3*(v+n)]=x;pos[3*(v+n)+1]=z0;pos[3*(v+n)+2]=-y; v++; }
    v+=n;
    let tris;
    if(n===4&&((p[0]===p[2]&&p[3]===p[5]&&p[4]===p[6]&&p[7]===p[1])||(p[1]===p[3]&&p[2]===p[4]&&p[5]===p[7]&&p[6]===p[0]))) tris=[0,1,2,0,2,3];
    else if(n===3) tris=[0,1,2];
    else { const c=[]; for(let j=0;j<n;j++) c.push(new THREE.Vector2(p[2*j],p[2*j+1])); tris=THREE.ShapeUtils.triangulateShape(c,[]).flat(); }
    for(const t of tris){ idx[k++]=base+t; } for(const t of tris){ idx[k++]=base+n+t; }
    for(let j=0;j<n;j++){ const a=j,b=(j+1)%n; idx[k++]=base+a;idx[k++]=base+b;idx[k++]=base+n+b; idx[k++]=base+a;idx[k++]=base+n+b;idx[k++]=base+n+a; }
    if(ep){ for(let j=0;j<n;j++){ const b=(j+1)%n, x0=p[2*j]-cx,y0=-(p[2*j+1]-cy), x1=p[2*b]-cx,y1=-(p[2*b+1]-cy);
      ep.set([x0,z1,y0,x1,z1,y1, x0,z0,y0,x1,z0,y1, x0,z0,y0,x0,z1,y0],e); e+=18; } }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx.subarray(0,k),1));
  g.computeBoundingSphere(); g.computeBoundingBox();
  let eg=null; if(ep){ eg=new THREE.BufferGeometry(); eg.setAttribute('position',new THREE.BufferAttribute(ep,3)); }
  return {g,eg};
}

function disposeAll(){

  root.clear(); state.layers=[]; state.substrate=null; state.cmpObj=null;

const busy=document.getElementById('busy'), busyMsg=document.getElementById('busyMsg');
const showBusy=m=>{busyMsg.textContent=m; busy.classList.add('show');};
const hideBusy=()=>busy.classList.remove('show');
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const CAP=600000;

async function rebuild(fit=true){
  if(!state.lib) return;
  stopBuild(false);
  showBusy(T('building')); await nextFrame();
  disposeAll();
  const defs=techDefs(state.tech); const keys=new Set(defs.map(d=>d.key));
  const total=makeCounter(state.lib,keys)(state.cell);
  const fl=flatten(state.lib,state.cell,keys,CAP);
  state.total=total; state.count=fl.count;
  const warn=document.getElementById('warn');
  if(fl.truncated){ warn.textContent=T('warnBig',{n:total.toLocaleString(),m:fl.count.toLocaleString()}); warn.style.display='block'; }
  else if(!fl.count){ warn.textContent=T('noShapes'); warn.style.display='block'; }
  else warn.style.display='none';
  const u=state.lib.dbu;
  let bb=fl.count?fl.bb:[0,0,1/u,1/u];
  const cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2;
  state.w=Math.max((bb[2]-bb[0])*u,1e-3); state.h=Math.max((bb[3]-bb[1])*u,1e-3);
  const used=defs.filter(d=>fl.layers.get(d.key)?.length);
  const zmin=Math.min(0,...used.map(d=>d.z0)), zmax=Math.max(1,...used.map(d=>d.z1));
  state.stackH=zmax-zmin;
  state.zAuto=Math.max(1,Math.max(state.w,state.h)/(state.stackH*6));
  const withEdges=fl.count<40000;
  // sort by z for ranks
  used.sort((a,b)=>a.z0-b.z0||a.z1-b.z1);
  used.forEach((d,rank)=>{
    const polysUm=fl.layers.get(d.key).map(p=>{const q=new Float64Array(p.length); for(let j=0;j<p.length;j++) q[j]=p[j]*u; return q;});
    const {g,eg}=buildGeometry(polysUm,d.z0,d.z1,cx*u,cy*u,withEdges);
    const kind=d.kind, isMetal=kind==='metal'||kind==='topmetal'||kind==='via'||kind==='contact';
    const mat=new THREE.MeshStandardMaterial({color:d.color,roughness:isMetal?0.38:0.6,metalness:isMetal?0.35:0.05,flatShading:true,side:THREE.DoubleSide,
      transparent:kind==='well',opacity:kind==='well'?0.55:1,depthWrite:kind!=='well',clippingPlanes:[clipPlane],polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
    const grp=new THREE.Group(); const mesh=new THREE.Mesh(g,mat); mesh.userData.layer=null; grp.add(mesh);
    if(eg){ const lm=new THREE.LineBasicMaterial({color:new THREE.Color(d.color).multiplyScalar(0.45),transparent:true,opacity:0.6,clippingPlanes:[clipPlane]}); grp.add(new THREE.LineSegments(eg,lm)); }
    root.add(grp);
    const L={def:d,rank,group:grp,mesh,count:polysUm.length,visible:true,anim:0};
    mesh.userData.layer=L; state.layers.push(L);
  });
  // substrate slab
  const sg=new THREE.BoxGeometry(state.w*1.08+0.4,0.7,state.h*1.08+0.4); sg.translate(0,zmin-0.35-0.001,0);
  const sm=new THREE.MeshStandardMaterial({color:COLORS.substrate,roughness:0.3,metalness:0.5,clippingPlanes:[clipPlane]});
  const sub=new THREE.Mesh(sg,sm); const sgrp=new THREE.Group(); sgrp.add(sub); root.add(sgrp);
  state.substrate={def:{kind:'substrate',color:COLORS.substrate,short:'wafer'},group:sgrp,mesh:sub,rank:-1,visible:true,anim:0}; sub.userData.layer=state.substrate;
  state.zmin=zmin;
  const zs=document.getElementById('zscale'); if(fit){ zs.value=zToSlider(state.zAuto); }
  state.zscale=sliderToZ(+zs.value);
  setCompare(state.cmp,false);
  applyLayout(); renderLegend(); renderStats();
  if(fit) fitView('3d');
  hideBusy();
}

/* z-scale slider mapping: exponential 0.5 .. max */
const zMax=()=>Math.max(40,state.zAuto*6);
const sliderToZ=v=>0.5*Math.pow(zMax()/0.5,v/100);
const zToSlider=z=>Math.round(100*Math.log(z/0.5)/Math.log(zMax()/0.5));

function applyLayout(){
  const s=state.zscale, gap=state.stackH*s*0.3*state.explode;
  const cut=+document.getElementById('slice').value;
  for(const L of state.layers){
    let off=L.rank*gap+(L.anim||0);
    L.group.scale.y=s; L.group.position.y=off;
    L.group.visible=L.visible && !(state.build && L.rank>state.build.step-1);
  }
  if(state.substrate){ state.substrate.group.scale.y=s; state.substrate.group.position.y=-gap*0.6; state.substrate.group.visible=state.substrate.visible; }
  const half=state.w*0.6+0.3; clipPlane.constant=cut>=100?1e9:(-half+2*half*cut/100);
  document.getElementById('zval').textContent='×'+(s<10?s.toFixed(1):Math.round(s));
}

/* comparison objects at true scale (not stretched) */
function setCompare(kind,announce=true){
  state.cmp=kind;
  if(state.cmpObj){ root.remove(state.cmpObj); state.cmpObj.traverse(o=>{o.geometry?.dispose();o.material?.dispose();}); state.cmpObj=null; }
  if(kind==='none'){ if(announce) fitView('3d'); return; }
  const gap=Math.max(state.w,state.h)*0.08+1;
  let obj;
  if(kind==='hair'){
    const r=35, len=Math.max(state.h*1.3,r*6);
    const g=new THREE.CylinderGeometry(r,r,len,64,1,false); g.rotateX(Math.PI/2);
    obj=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:'#7a4a2b',roughness:0.45,metalness:0.1}));
    obj.position.set(state.w/2+gap+r,r+state.zmin,0);
  } else {
    const R=3.75, pts=[]; for(let i=0;i<=40;i++){ const t=i/40, x=R*t; const y=1.25*Math.sqrt(Math.max(0,1-t*t))*(0.35+0.65*t*t)+0.08; pts.push(new THREE.Vector2(x,y)); }
    const top=new THREE.LatheGeometry(pts,64); const bot=top.clone(); bot.scale(1,-1,1);
    obj=new THREE.Group(); const m=new THREE.MeshStandardMaterial({color:'#d7263d',roughness:0.4,metalness:0.05,side:THREE.DoubleSide});
    obj.add(new THREE.Mesh(top,m)); obj.add(new THREE.Mesh(bot,m));
    obj.rotation.x=Math.PI/2; obj.position.set(state.w/2+gap+R,R+state.zmin,0);
  }
  obj.userData.cmp=kind; state.cmpObj=obj; root.add(obj);
  if(announce){ fitView('3d'); showCard(null,kind==='hair'?T('hairCard'):T('bloodCard'),kind==='hair'?T('hairText'):T('bloodText'),kind==='hair'?'#7a4a2b':'#d7263d'); }
}

function sceneBox(){
  const b=new THREE.Box3(); const s=state.zscale;
  b.expandByPoint(new THREE.Vector3(-state.w/2,state.zmin*s-0.7*s,-state.h/2));
  b.expandByPoint(new THREE.Vector3(state.w/2,(state.zmin+state.stackH)*s*(1+0.3*state.explode*state.layers.length),state.h/2));
  if(state.cmpObj){ b.expandByObject(state.cmpObj); }
  return b;
}
function refitSoft(){ const b=sceneBox(), c=b.getCenter(new THREE.Vector3()); const d=camera.position.clone().sub(controls.target); controls.target.copy(c); camera.position.copy(c).add(d);
  const sz=b.getSize(new THREE.Vector3()); const need=(Math.max(sz.x,sz.y,sz.z)*0.62)/Math.sin(camera.fov*Math.PI/360)*1.05; if(d.length()<need*0.8) camera.position.copy(c).add(d.setLength(need)); camera.far=Math.max(camera.far,need*100); camera.updateProjectionMatrix(); }
function fitView(mode){
  const b=sceneBox(), c=b.getCenter(new THREE.Vector3()), sz=b.getSize(new THREE.Vector3());
  const r=Math.max(sz.x,sz.y,sz.z)*0.62+1e-3; const dist=r/Math.sin(camera.fov*Math.PI/360)*1.05;
  let dir=mode==='top'?new THREE.Vector3(0,1,0.0001):mode==='side'?new THREE.Vector3(0,0.12,1):new THREE.Vector3(0.9,0.85,1.15);
  dir.normalize();
  controls.target.copy(c); camera.position.copy(c).addScaledVector(dir,dist);
  camera.near=dist/1000; camera.far=dist*100; camera.updateProjectionMatrix(); controls.update();
}

/* =========================== UI =========================== */
const $=id=>document.getElementById(id);
function layerName(d){
  const K=I18N[lang].K[d.kind]||I18N[lang].K.generic;
  return [K[0].replace('{n}',d.level).replace('{m}',d.level+1).replace('{k}',d.short), K[1]];
}
function renderLegend(){
  const box=$('layers'); box.innerHTML='';
  const all=[...state.layers].sort((a,b)=>b.rank-a.rank); if(state.substrate) all.push(state.substrate);
  for(const L of all){
    const [nm]=layerName(L.def);
    const row=document.createElement('div'); row.className='lay'+(L.visible?'':' dim');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=L.visible;
    cb.onclick=e=>{e.stopPropagation(); L.visible=cb.checked; row.classList.toggle('dim',!L.visible); applyLayout();};
    row.innerHTML=`<span class="sw" style="background:${L.def.color}"></span><span class="nm"><div></div><small></small></span>`;
    row.prepend(cb); row.querySelector('.nm div').textContent=nm;
    row.querySelector('small').textContent=L.def.kind==='substrate'?'':`${L.def.short} · ${L.def.key}${L.count?' · '+L.count.toLocaleString():''}`;
    row.onclick=()=>{ explainLayer(L); };
    box.appendChild(row);
  }
  const keys=new Set(techDefs(state.tech).map(d=>d.key)); const hidden=[...state.libKeys.keys()].filter(k=>!keys.has(k));
  $('hiddenNote').textContent=hidden.length?T('hidden',{n:hidden.length}):'';
}
function renderStats(){
  const w=state.w,h=state.h, fmt=x=>x<10?x.toFixed(2):x<1000?x.toFixed(1):Math.round(x).toLocaleString();
  const wmax=Math.max(w,h); const fact=wmax<70?T('factSmall',{n:Math.max(1,Math.floor(70/wmax))}):T('factBig',{n:Math.round(wmax/70).toLocaleString()});
  const cells=state.lib?state.lib.structs.size:0;
  $('stats').innerHTML=`<b></b><div>${T('size')}: ${fmt(w)} × ${fmt(h)} µm</div><div>${state.count.toLocaleString()} ${T('pieces')} · ${cells} ${T('cells')}</div><div class="fact"></div>`;
  $('stats').querySelector('b').textContent=state.isDemo?'mini_chip_demo':state.fileName+' › '+state.cell;
  $('stats').querySelector('.fact').textContent=fact;
}
function showCard(step,title,text,color,nav=false){
  $('cStep').textContent=step||''; $('cStep').style.display=step?'block':'none';
  $('cTitle').innerHTML=(color?`<span class="sw" style="background:${color}"></span>`:'')+'<span></span>'; $('cTitle').lastChild.textContent=title;
  $('cText').textContent=text; $('cNav').style.display=nav?'flex':'none';
  const c=$('card'); c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
}
const hideCard=()=>$('card').classList.remove('show');
function placeCard(){ $('card').style.bottom=($('dock').offsetHeight+24)+'px'; }
new ResizeObserver(placeCard).observe(document.getElementById('dock'));
function explainLayer(L){ const [nm,tx]=layerName(L.def); showCard(null,nm,tx,L.def.color); flash(L); }
function flash(L){ const m=L.mesh.material; const t0=performance.now(); const base=new THREE.Color(L.def.color);
  const tick=()=>{ const t=(performance.now()-t0)/1200; if(t>1){m.emissive.setRGB(0,0,0);return;} const k=Math.sin(t*Math.PI*3)**2*0.6; m.emissive.copy(base).multiplyScalar(k); requestAnimationFrame(tick); }; tick(); }

/* ---------- build animation ---------- */
function startBuild(){
  if(!state.layers.length) return;
  state.build={step:0,playing:true,next:0}; controls.autoRotate=true; $('bRotate').classList.add('on');
  showStep(0);
}
function buildSteps(){ return [state.substrate,...[...state.layers].sort((a,b)=>a.rank-b.rank)]; }
function showStep(i){
  const steps=buildSteps(); const b=state.build; b.step=Math.max(0,Math.min(i,steps.length-1));
  const L=steps[b.step]; if(L!==state.substrate){ L.anim=state.stackH*state.zscale*2.5; L.animT0=performance.now(); }
  for(const X of state.layers) if(X!==L) X.anim=0;
  const [nm,tx]=layerName(L.def);
  showCard(T('step',{i:b.step+1,n:steps.length}),nm,tx,L.def.color,true);
  $('bPause').textContent=b.playing?T('pause'):T('play');
  b.next=performance.now()+5200;
  applyLayout();
}
function stopBuild(showAll=true){ if(!state.build) return; state.build=null; for(const L of state.layers) L.anim=0; if(showAll){ applyLayout(); hideCard(); } }
$('bNext').onclick=()=>{ if(!state.build) return; const n=buildSteps().length; if(state.build.step>=n-1) stopBuild(); else showStep(state.build.step+1); };
$('bPrev').onclick=()=>{ if(state.build) showStep(state.build.step-1); };
$('bPause').onclick=()=>{ if(!state.build) return; state.build.playing=!state.build.playing; state.build.next=performance.now()+5200; $('bPause').textContent=state.build.playing?T('pause'):T('play'); };
$('bFinish').onclick=()=>stopBuild();
$('cardX').onclick=()=>{ stopBuild(); hideCard(); };
$('btnBuild').onclick=startBuild;

/* ---------- controls ---------- */
$('explode').oninput=e=>{ state.explode=+e.target.value/100; applyLayout(); refitSoft(); };
$('zscale').oninput=e=>{ state.zscale=sliderToZ(+e.target.value); applyLayout(); refitSoft(); };
$('slice').oninput=()=>applyLayout();
$('bRotate').onclick=()=>{ controls.autoRotate=!controls.autoRotate; $('bRotate').classList.toggle('on',controls.autoRotate); };
$('v3d').onclick=()=>fitView('3d'); $('vTop').onclick=()=>fitView('top'); $('vSide').onclick=()=>fitView('side');
$('allOn').onclick=()=>{ state.layers.forEach(L=>L.visible=true); if(state.substrate) state.substrate.visible=true; renderLegend(); applyLayout(); };
$('allOff').onclick=()=>{ state.layers.forEach(L=>L.visible=false); renderLegend(); applyLayout(); };
$('compare').onchange=e=>setCompare(e.target.value);
$('tech').onchange=e=>{ state.tech=e.target.value; rebuild(true); };
$('cell').onchange=e=>{ state.cell=e.target.value; rebuild(true); };
$('legendToggle').onclick=()=>$('legend').classList.toggle('open');
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); if(state.build) $('bNext').click(); else startBuild(); }
  if(e.key==='ArrowLeft'&&state.build) $('bPrev').click();
  if(e.key==='Escape'){ stopBuild(); hideCard(); } });

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect(); ptr.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const objs=state.layers.filter(L=>L.group.visible).map(L=>L.mesh); if(state.substrate?.group.visible) objs.push(state.substrate.mesh);
  if(state.cmpObj) objs.push(state.cmpObj);
  const hits=ray.intersectObjects(objs,true).filter(h=>clipPlane.distanceToPoint(h.point)>=0||h.object.parent===state.cmpObj||h.object===state.cmpObj);
  return hits[0];
}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return; down=null;
  const h=pick(e); if(!h) return;
  let o=h.object; if(o===state.cmpObj||o.parent===state.cmpObj){ setCompare(state.cmp); return; }
  const L=o.userData.layer; if(L){ if(state.build) stopBuild(false); explainLayer(L); }
});
const tip=$('tip'); let lastHover=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons||state.count>60000){ tip.style.display='none'; return; }
  const now=performance.now(); if(now-lastHover<60) return; lastHover=now;
  const h=pick(e); const L=h?.object.userData.layer;
  if(L){ tip.textContent=layerName(L.def)[0]; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+12)+'px'; tip.style.display='block'; renderer.domElement.style.cursor='pointer'; }
  else { tip.style.display='none'; renderer.domElement.style.cursor=''; }
});

/* ---------- loading ---------- */
function detectTech(keys){
  let best='auto',bestScore=0;
  for(const id in TECHS){ let s=0, metals=0; for(const [k,kind] of TECHS[id].layers){ const c=keys.get(k)||0; if(c){ s+=c; if(kind==='metal'||kind==='topmetal') metals++; } }
    const tot=[...keys.values()].reduce((a,b)=>a+b,0)||1; const score=metals>=1?s/tot:0; if(score>bestScore){bestScore=score;best=id;} }
  return bestScore>0.25?best:'auto';
}
function fillCells(){
  const sel=$('cell'); sel.innerHTML=''; const lib=state.lib; const cnt=makeCounter(lib,null);
  const tops=topCells(lib).sort((a,b)=>cnt(b)-cnt(a)); const tset=new Set(tops);
  const rest=[...lib.structs.keys()].filter(n=>!tset.has(n)).sort();
  for(const n of [...tops,...rest].slice(0,3000)){ const o=document.createElement('option'); o.value=n; o.textContent=(tset.has(n)?'★ ':'')+n+'  ('+cnt(n).toLocaleString()+')'; sel.appendChild(o); }
  state.cell=tops[0]||rest[0]; sel.value=state.cell;
}
async function loadBuffer(buf,name,isDemo){
  showBusy(T('loading')); await nextFrame();
  try{
    let u8=new Uint8Array(buf);
    if(u8[0]===0x1f&&u8[1]===0x8b){ const ds=new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))); buf=await ds.arrayBuffer(); }
    const lib=parseGDS(buf);
    state.lib=lib; state.isDemo=isDemo; state.fileName=name; state.libKeys=libKeys(lib);
    state.tech=detectTech(state.libKeys); $('tech').value=state.tech;
    fillCells(); await rebuild(true);
    if(isDemo) showCard(null,T('welcomeT'),T('welcomeP')+' '+T('demoNote'),null);
    else hideCard();
  }catch(err){ console.error(err); hideBusy(); showCard(null,'😕',T('badFile'),null); }
}
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) f.arrayBuffer().then(b=>loadBuffer(b,f.name,false)); e.target.value=''; };
$('btnDemo').onclick=loadDemo;
function loadDemo(){ const b64=$('demo').textContent.trim(); const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); loadBuffer(u.buffer,'demo',true); }
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault(); dragN++; $('drop').classList.add('show');});
addEventListener('dragleave',e=>{ dragN=Math.max(0,dragN-1); if(!dragN) $('drop').classList.remove('show'); });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{ e.preventDefault(); dragN=0; $('drop').classList.remove('show'); const f=e.dataTransfer.files[0]; if(f) f.arrayBuffer().then(b=>loadBuffer(b,f.name,false)); });

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $('subtitle').textContent=T('subtitle'); $('btnBuild').textContent=T('build'); $('tOpen').textContent=T('open'); $('btnDemo').textContent=T('demo');
  $('tLayers').textContent=T('layers'); $('allOn').textContent=T('all'); $('allOff').textContent=T('none');
  $('tExplode').textContent=T('explode'); $('tHeight').textContent=T('height'); $('tSlice').textContent=T('slice');
  $('bRotate').textContent=T('rotate'); $('vTop').textContent=T('top'); $('vSide').textContent=T('side');
  $('tCompare').textContent=T('compare'); $('tTech').textContent=T('tech'); $('tCell').textContent=T('cell'); $('tDrop').textContent=T('drop');
  $('bFinish').textContent=T('finish');
  const cmp=$('compare'), cv=state.cmp; cmp.innerHTML=''; for(const [v,k] of [['none','cmpNone'],['hair','cmpHair'],['blood','cmpBlood']]){ const o=document.createElement('option'); o.value=v; o.textContent=T(k); cmp.appendChild(o);} cmp.value=cv;
  const tech=$('tech'); tech.innerHTML=''; for(const id in TECHS){ const o=document.createElement('option'); o.value=id; o.textContent=TECHS[id].label; tech.appendChild(o);} { const o=document.createElement('option'); o.value='auto'; o.textContent=T('techAuto'); tech.appendChild(o);} tech.value=state.tech;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  if(state.lib){ renderLegend(); renderStats(); if(state.build) showStep(state.build.step); else hideCard(); }
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{localStorage.setItem('chipx-lang',lang);}catch(e){} applyLang(); });

/* ---------- loop ---------- */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
function loop(now){
  requestAnimationFrame(loop);
  let dirty=false;
  for(const L of state.layers){ if(L.anim>0&&L.animT0){ const t=Math.min(1,(now-L.animT0)/1100); const e=1-Math.pow(1-t,3); const start=state.stackH*state.zscale*2.5; L.anim=start*(1-e); if(t>=1){L.anim=0;L.animT0=0;} dirty=true; } }
  if(state.build&&state.build.playing&&now>state.build.next){ const n=buildSteps().length; if(state.build.step<n-1) showStep(state.build.step+1); else { state.build.playing=false; $('bPause').textContent=T('play'); } }
  if(dirty) applyLayout();
  controls.update(); renderer.render(scene,camera);
}
applyLang(); requestAnimationFrame(loop); loadDemo();
window.__chipx={state,parseGDS,flatten};
</script>
